<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marks Entry - LAZEIMS Station</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
  </script>
  <style>
    .att-toggle { position:relative; display:inline-flex; align-items:center; width:56px; height:28px; border-radius:14px; cursor:pointer; transition:background .2s; border:none; }
    .att-toggle.att-p { background:#10b981; }
    .att-toggle.att-a { background:#ef4444; }
    .att-knob { position:absolute; width:22px; height:22px; border-radius:50%; background:#fff; top:3px; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
    .att-p .att-knob { left:3px; }
    .att-a .att-knob { left:31px; }
    .att-lp, .att-la { font-size:10px; font-weight:700; position:absolute; top:50%; transform:translateY(-50%); }
    .att-lp { left:26px; color:#fff; }
    .att-la { right:26px; color:#fff; }
    .att-p .att-la { display:none; }
    .att-a .att-lp { display:none; }
    .row-absent { opacity:.6; }
    .saving-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:#f59e0b; margin-left:4px; animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .marks-inp { width:80px; padding:4px 8px; border:1px solid #d1d5db; border-radius:6px; text-align:center; font-size:14px; }
    .marks-inp:focus { outline:none; border-color:#6366f1; box-shadow:0 0 0 2px rgba(99,102,241,.2); }
    .marks-inp.bad { border-color:#ef4444; background:#fef2f2; }
    .dark .marks-inp { background:#1f2937; border-color:#4b5563; color:#fff; }
    .dark .marks-inp.bad { background:#451a1a; border-color:#ef4444; }
    .st-saving { color:#f59e0b; font-size:12px; }
    .st-saved { color:#10b981; font-size:12px; }
    .st-dirty { color:#6366f1; font-size:12px; }
    .st-err { color:#ef4444; font-size:12px; }
    .marks-validation { padding:12px 16px; border-radius:8px; margin-top:12px; }
    .marks-validation.ok { background:#ecfdf5; border:1px solid #6ee7b7; }
    .marks-validation.blocked { background:#fef2f2; border:1px solid #fca5a5; }
    .dark .marks-validation.ok { background:rgba(16,185,129,.1); border-color:rgba(16,185,129,.3); }
    .dark .marks-validation.blocked { background:rgba(239,68,68,.1); border-color:rgba(239,68,68,.3); }
    .mv-title { font-weight:600; font-size:13px; margin-bottom:6px; }
    .mv-list { display:flex; flex-wrap:wrap; gap:6px; }
    .missing-chip { padding:2px 8px; border-radius:4px; background:#fee2e2; color:#991b1b; font-size:11px; border:none; cursor:pointer; }
    .missing-chip:hover { background:#fca5a5; }
    .dark .missing-chip { background:rgba(239,68,68,.2); color:#fca5a5; }
    .btn-warning { background:#f59e0b; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:12px; }
    .btn-warning:hover { background:#d97706; }
    .jump-highlight { animation:jumphl .5s ease; }
    @keyframes jumphl { 0%{box-shadow:0 0 0 3px rgba(99,102,241,.5)} 100%{box-shadow:none} }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 min-h-screen">
  <div id="app">
    <main class="lg:ml-64 pt-0 min-h-screen">
      <div class="p-4 md:p-6 max-w-7xl mx-auto">
        <!-- Portal View (scope selection) -->
        <div id="view-entry-portal">
          <!-- Filter chips -->
          <div id="portal-chips" class="flex flex-wrap gap-2 mb-4">
            <button class="chip px-3 py-1.5 rounded-lg text-sm font-medium bg-indigo-600 text-white active" data-f="all">All</button>
            <button class="chip px-3 py-1.5 rounded-lg text-sm font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300" data-f="open">Open</button>
            <button class="chip px-3 py-1.5 rounded-lg text-sm font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300" data-f="finalized">Finalized</button>
          </div>
          <!-- Scope list -->
          <div id="portal-scope-list" class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 overflow-x-auto"></div>
        </div>

        <!-- Entry View (active scope) -->
        <div id="view-entry" hidden>
          <div class="flex items-center gap-3 mb-4">
            <button id="entry-back" class="p-2 rounded-lg text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div>
              <h2 id="entry-title" class="text-base font-semibold text-gray-900 dark:text-white"></h2>
              <p id="entry-sub" class="text-xs text-gray-500 dark:text-gray-400"></p>
            </div>
          </div>

          <!-- Tabs -->
          <div class="flex gap-1 mb-4 border-b border-gray-200 dark:border-gray-700">
            <button class="tab px-4 py-2 text-sm font-medium border-b-2 border-indigo-600 text-indigo-600 dark:text-indigo-400 active" data-tab="attendance">Attendance</button>
            <button class="tab px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700" data-tab="marks">Marks</button>
          </div>

          <!-- Attendance Tab -->
          <div id="tab-attendance">
            <div class="flex flex-wrap items-center gap-3 mb-3">
              <button id="mark-all-present" class="px-3 py-1.5 text-xs font-medium bg-green-600 text-white rounded-lg hover:bg-green-700">Mark All Present</button>
              <button id="save-attendance" class="px-3 py-1.5 text-xs font-medium bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Save & continue to Marks</button>
              <span id="att-summary" class="text-xs text-gray-500 dark:text-gray-400"></span>
              <span id="att-absent-hint"></span>
            </div>
            <div id="att-validation" hidden class="marks-validation"></div>
            <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 overflow-x-auto">
              <table class="w-full text-sm">
                <thead>
                  <tr class="border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50">
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">#</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">ID</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">Name</th>
                    <th class="px-3 py-2 text-center text-xs font-medium text-gray-500">Status</th>
                  </tr>
                </thead>
                <tbody id="att-tbody"></tbody>
              </table>
            </div>
          </div>

          <!-- Marks Tab -->
          <div id="tab-marks" hidden>
            <div class="flex flex-wrap items-center gap-3 mb-3">
              <span id="marks-summary" class="text-xs text-gray-500 dark:text-gray-400"></span>
              <button id="check-completeness" class="px-3 py-1.5 text-xs font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700">Check completeness</button>
              <button id="finalize-btn" class="px-3 py-1.5 text-xs font-medium bg-green-600 text-white rounded-lg hover:bg-green-700">Finalize Scope</button>
            </div>
            <div id="marks-validation" hidden class="marks-validation"></div>
            <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 overflow-x-auto">
              <table class="w-full text-sm">
                <thead>
                  <tr class="border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50">
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">#</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">ID</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">Name</th>
                    <th class="px-3 py-2 text-center text-xs font-medium text-gray-500">Att</th>
                    <th class="px-3 py-2 text-center text-xs font-medium text-gray-500">Marks</th>
                    <th class="px-3 py-2 text-center text-xs font-medium text-gray-500">Status</th>
                  </tr>
                </thead>
                <tbody id="marks-tbody"></tbody>
              </table>
            </div>
          </div>

          <!-- Status bar -->
          <div id="entry-statusbar" class="mt-3 flex flex-wrap gap-4 text-xs text-gray-600 dark:text-gray-400"></div>
          <p id="entry-msg" class="mt-2 text-sm min-h-[1.25rem]"></p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initNav, setPageTitle } from './static/shared/nav.js';
    import { showTableSkeleton } from './static/shared/loading.js';

    // Override router's showView before importing entry modules
    // The entry.js imports showView from router.js which relies on old SPA elements.
    // We need to patch the router module first.
    import * as router from './static/js/router.js';

    // Replace showView with a page-local version that just toggles our two views
    const localShowView = function(name) {
      const portal = document.getElementById('view-entry-portal');
      const entry = document.getElementById('view-entry');
      if (portal) portal.hidden = (name !== 'entry-portal');
      if (entry) entry.hidden = (name !== 'entry');
    };

    // Monkey-patch: entry.js imports { showView } from './router.js'
    // Since ES modules use live bindings, we can't patch the import.
    // Instead, override it on window and patch the module's exports object.
    Object.defineProperty(router, 'showView', { value: localShowView, writable: true });

    // Now import entry modules (they will use the patched showView)
    const { loadPortal, initPortal } = await import('./static/js/portal.js');
    const { initEntry } = await import('./static/js/entry.js');
    const { initFinalize } = await import('./static/js/finalize.js');

    async function boot() {
      const session = await initNav();
      if (!session) return;
      setPageTitle('Marks Entry');

      showTableSkeleton('portal-scope-list', 5, 6);

      initPortal();
      initEntry();
      initFinalize();
      await loadPortal();
    }

    boot();
  </script>
</body>
</html>
