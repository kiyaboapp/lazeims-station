<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schools - LAZEIMS Station</title>
  <link rel="stylesheet" href="/static/dist/tailwind.css">
  <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen">
  <div id="app">
    <main class="lg:ml-64 pt-0 min-h-screen">
      <div class="p-4 md:p-6 max-w-7xl mx-auto">
        <!-- Search and filter bar -->
        <div class="flex flex-col sm:flex-row gap-3 mb-6">
          <div class="relative flex-1">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input id="search-input" type="text" placeholder="Search by centre number, name, council or region..." class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm">
          </div>
          <div class="flex gap-2">
            <select id="sort-select" class="px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white text-sm">
              <option value="centre">Sort: Centre #</option>
              <option value="name">Sort: Name</option>
              <option value="students">Sort: Students</option>
              <option value="progress">Sort: Progress</option>
            </select>
          </div>
        </div>

        <!-- Summary cards -->
        <div id="summary-cards" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"></div>

        <!-- Schools table -->
        <div id="schools-content" class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
          <div id="schools-table-container" class="overflow-x-auto"></div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { api, esc, fmt, pct } from './static/js/api.js';
    import { initNav, setPageTitle } from './static/shared/nav.js';
    import { showTableSkeleton } from './static/shared/loading.js';

    let schools = [];
    let sortField = 'centre';
    let searchTerm = '';

    async function boot() {
      const session = await initNav();
      if (!session) return;
      setPageTitle('Schools');

      showTableSkeleton('schools-table-container', 8, 5);

      try {
        schools = await api('/api/schools').then(r => r.json());
      } catch (e) {
        schools = [];
      }

      renderSummary();
      renderTable();
    }

    function renderSummary() {
      const totalSchools = schools.length;
      const totalStudents = schools.reduce((s, sc) => s + (sc.students || 0), 0);
      const totalScopes = schools.reduce((s, sc) => s + (sc.total_scopes || 0), 0);
      const finScopes = schools.reduce((s, sc) => s + (sc.finalized_scopes || 0), 0);

      document.getElementById('summary-cards').innerHTML = [
        { label: 'Schools', value: fmt(totalSchools), color: 'indigo' },
        { label: 'Students', value: fmt(totalStudents), color: 'blue' },
        { label: 'Total Scopes', value: fmt(totalScopes), color: 'purple' },
        { label: 'Finalized', value: `${fmt(finScopes)}/${fmt(totalScopes)}`, color: finScopes === totalScopes && totalScopes > 0 ? 'green' : 'yellow' },
      ].map(k => `
        <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4">
          <p class="text-2xl font-bold text-${k.color}-600 dark:text-${k.color}-400">${k.value}</p>
          <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">${k.label}</p>
        </div>
      `).join('');
    }

    function getFiltered() {
      let list = [...schools];
      if (searchTerm) {
        const q = searchTerm.toLowerCase();
        list = list.filter(s => s.centre_number.toLowerCase().includes(q) || (s.name || '').toLowerCase().includes(q) || (s.council_name || '').toLowerCase().includes(q) || (s.region_name || '').toLowerCase().includes(q));
      }
      list.sort((a, b) => {
        if (sortField === 'centre') return a.centre_number.localeCompare(b.centre_number);
        if (sortField === 'name') return (a.name || '').localeCompare(b.name || '');
        if (sortField === 'students') return (b.students || 0) - (a.students || 0);
        if (sortField === 'progress') return pct(b.finalized_scopes, b.total_scopes) - pct(a.finalized_scopes, a.total_scopes);
        return 0;
      });
      return list;
    }

    function renderTable() {
      const list = getFiltered();
      if (!list.length) {
        document.getElementById('schools-table-container').innerHTML = `
          <div class="p-8 text-center text-gray-500 dark:text-gray-400">
            <p class="text-sm">${searchTerm ? 'No schools matching your search.' : 'No schools found.'}</p>
          </div>`;
        return;
      }

      document.getElementById('schools-table-container').innerHTML = `
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50">
              <th class="text-left px-4 py-3 font-medium text-gray-600 dark:text-gray-400">Centre #</th>
              <th class="text-left px-4 py-3 font-medium text-gray-600 dark:text-gray-400">School Name</th>
              <th class="text-left px-4 py-3 font-medium text-gray-600 dark:text-gray-400">Council</th>
              <th class="text-left px-4 py-3 font-medium text-gray-600 dark:text-gray-400">Region</th>
              <th class="text-center px-4 py-3 font-medium text-gray-600 dark:text-gray-400">Students</th>
              <th class="text-center px-4 py-3 font-medium text-gray-600 dark:text-gray-400">Scopes</th>
              <th class="px-4 py-3 font-medium text-gray-600 dark:text-gray-400">Progress</th>
              <th class="px-4 py-3"></th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
            ${list.map((s, i) => {
              const p = pct(s.finalized_scopes, s.total_scopes);
              const barColor = p === 100 ? 'bg-green-500' : p > 50 ? 'bg-indigo-500' : 'bg-yellow-500';
              return `
                <tr class="hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors cursor-pointer" data-idx="${i}" onclick="toggleDetail(${i})">
                  <td class="px-4 py-3 font-mono text-xs text-gray-900 dark:text-white">${esc(s.centre_number)}</td>
                  <td class="px-4 py-3 text-gray-900 dark:text-white font-medium">${esc(s.name || '-')}</td>
                  <td class="px-4 py-3 text-gray-600 dark:text-gray-400 text-xs">${esc(s.council_name || '-')}</td>
                  <td class="px-4 py-3 text-gray-600 dark:text-gray-400 text-xs">${esc(s.region_name || '-')}</td>
                  <td class="px-4 py-3 text-center text-gray-600 dark:text-gray-400">${fmt(s.students)}</td>
                  <td class="px-4 py-3 text-center"><span class="text-green-600 dark:text-green-400 font-medium">${s.finalized_scopes}</span><span class="text-gray-400">/${s.total_scopes}</span></td>
                  <td class="px-4 py-3">
                    <div class="flex items-center gap-2">
                      <div class="flex-1 h-2 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
                        <div class="${barColor} h-full rounded-full transition-all" style="width:${p}%"></div>
                      </div>
                      <span class="text-xs text-gray-500 dark:text-gray-400 w-9 text-right">${p}%</span>
                    </div>
                  </td>
                  <td class="px-4 py-3 text-center">
                    <svg class="w-4 h-4 text-gray-400 transition-transform expand-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                  </td>
                </tr>
                <tr id="detail-${i}" class="hidden">
                  <td colspan="8" class="px-4 py-4 bg-gray-50 dark:bg-gray-900/50">
                    ${renderScopeDetail(s)}
                  </td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>`;
    }

    function renderScopeDetail(school) {
      if (!school.scopes || !school.scopes.length) return '<p class="text-sm text-gray-500">No scope details available.</p>';
      return `
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
          ${school.scopes.map(sc => {
            const paper = sc.paper_type.replace('THEORY1', 'T1').replace('THEORY2', 'T2').replace('PRACTICAL', 'P');
            const statusClass = sc.finalized ? 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400' :
              sc.lock_status === 'LOCKED' ? 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-400' :
              'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400';
            const statusText = sc.finalized ? 'Finalized' : sc.lock_status === 'LOCKED' ? 'In Use' : 'Open';
            return `
              <div class="bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 p-3">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-sm font-medium text-gray-900 dark:text-white">${esc(sc.subject_name || sc.subject_code)} (${paper})</span>
                  <span class="px-2 py-0.5 rounded text-xs font-medium ${statusClass}">${statusText}</span>
                </div>
                <div class="grid grid-cols-3 gap-2 text-xs text-gray-500 dark:text-gray-400">
                  <div><span class="block font-medium text-gray-900 dark:text-white">${sc.marks_entered}</span>Marks</div>
                  <div><span class="block font-medium text-green-600">${sc.att_present}</span>Present</div>
                  <div><span class="block font-medium text-red-600">${sc.att_absent}</span>Absent</div>
                </div>
              </div>`;
          }).join('')}
        </div>`;
    }

    window.toggleDetail = function(idx) {
      const row = document.getElementById('detail-' + idx);
      if (row) {
        row.classList.toggle('hidden');
        const parentRow = row.previousElementSibling;
        const icon = parentRow?.querySelector('.expand-icon');
        if (icon) icon.classList.toggle('rotate-180');
      }
    };

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchTerm = e.target.value.trim();
      renderTable();
    });

    document.getElementById('sort-select').addEventListener('change', (e) => {
      sortField = e.target.value;
      renderTable();
    });

    boot();
  </script>
</body>
</html>
