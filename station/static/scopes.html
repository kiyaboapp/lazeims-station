<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subject Papers - LAZEIMS Station</title>
  <link rel="stylesheet" href="/static/dist/tailwind.css">
  <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen">
  <div id="app">
    <main class="lg:ml-64 pt-0 min-h-screen">
      <div class="p-4 md:p-6 max-w-7xl mx-auto">
        <!-- Search and filter bar -->
        <div class="flex flex-col sm:flex-row gap-3 mb-6">
          <div class="relative flex-1">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input id="search-input" type="text" placeholder="Search by school, subject or centre number..." class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm">
          </div>
          <div class="flex gap-2">
            <select id="status-filter" class="px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white text-sm">
              <option value="all">All Status</option>
              <option value="open">Open</option>
              <option value="in_use">In Use</option>
              <option value="finalized">Finalized</option>
            </select>
          </div>
        </div>

        <!-- Summary cards -->
        <div id="scope-summary" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"></div>

        <!-- Subject Papers table -->
        <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
          <div id="scopes-table-container" class="overflow-x-auto"></div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { api, jpost, esc, fmt, pct } from './static/js/api.js';
    import { initNav, setPageTitle, getSession } from './static/shared/nav.js';
    import { showTableSkeleton } from './static/shared/loading.js';

    let scopes = [];
    let activeFilter = 'all';
    let searchTerm = '';
    let session = null;

    async function boot() {
      session = await initNav();
      if (!session) return;
      setPageTitle('Subject Papers');

      showTableSkeleton('scopes-table-container', 8, 6);

      try {
        scopes = await api('/api/scopes').then(r => r.json());
      } catch (e) { scopes = []; }

      renderSummary();
      renderTable();
    }

    function renderSummary() {
      const total = scopes.length;
      const open = scopes.filter(s => !s.finalized && s.lock_status !== 'LOCKED').length;
      const inUse = scopes.filter(s => !s.finalized && s.lock_status === 'LOCKED').length;
      const finalized = scopes.filter(s => s.finalized).length;

      document.getElementById('scope-summary').innerHTML = [
        { label: 'Total', value: fmt(total), color: 'indigo' },
        { label: 'Open', value: fmt(open), color: 'blue' },
        { label: 'In Use', value: fmt(inUse), color: 'yellow' },
        { label: 'Finalized', value: fmt(finalized), color: 'green' },
      ].map(k => `
        <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4">
          <p class="text-2xl font-bold text-${k.color}-600 dark:text-${k.color}-400">${k.value}</p>
          <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">${k.label}</p>
        </div>
      `).join('');
    }

    function getFiltered() {
      let list = [...scopes];
      if (activeFilter === 'open') list = list.filter(s => !s.finalized && s.lock_status !== 'LOCKED');
      else if (activeFilter === 'in_use') list = list.filter(s => !s.finalized && s.lock_status === 'LOCKED');
      else if (activeFilter === 'finalized') list = list.filter(s => s.finalized);

      if (searchTerm) {
        const q = searchTerm.toLowerCase();
        list = list.filter(s =>
          s.centre_number.toLowerCase().includes(q) ||
          (s.school_name || '').toLowerCase().includes(q) ||
          (s.subject_name || '').toLowerCase().includes(q) ||
          (s.subject_code || '').toLowerCase().includes(q)
        );
      }
      return list;
    }

    function renderTable() {
      const list = getFiltered();
      const isAdmin = session?.role === 'EXAM_ADMIN';

      if (!list.length) {
        document.getElementById('scopes-table-container').innerHTML = `
          <div class="p-8 text-center text-gray-500 dark:text-gray-400">
            <p class="text-sm">${searchTerm || activeFilter !== 'all' ? 'No subject papers matching your filter.' : 'No subject papers found.'}</p>
          </div>`;
        return;
      }

      document.getElementById('scopes-table-container').innerHTML = `
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50">
              <th class="text-left px-4 py-3 font-medium text-gray-600 dark:text-gray-400">Centre #</th>
              <th class="text-left px-4 py-3 font-medium text-gray-600 dark:text-gray-400">School</th>
              <th class="text-left px-4 py-3 font-medium text-gray-600 dark:text-gray-400">Subject</th>
              <th class="text-left px-4 py-3 font-medium text-gray-600 dark:text-gray-400">Paper</th>
              <th class="text-center px-4 py-3 font-medium text-gray-600 dark:text-gray-400">Status</th>
              ${isAdmin ? '<th class="px-4 py-3 font-medium text-gray-600 dark:text-gray-400">Locked By</th>' : ''}
              ${isAdmin ? '<th class="px-4 py-3"></th>' : ''}
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
            ${list.map(s => {
              const paper = s.paper_type.replace('THEORY1', 'Theory 1').replace('THEORY2', 'Theory 2').replace('PRACTICAL', 'Practical');
              let statusClass, statusText;
              if (s.finalized) {
                statusClass = 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400';
                statusText = 'Finalized';
              } else if (s.lock_status === 'LOCKED') {
                statusClass = 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-400';
                statusText = 'In Use';
              } else {
                statusClass = 'bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-400';
                statusText = 'Open';
              }
              return `
                <tr class="hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors">
                  <td class="px-4 py-3 font-mono text-xs text-gray-900 dark:text-white">${esc(s.centre_number)}</td>
                  <td class="px-4 py-3 text-gray-900 dark:text-white">${esc(s.school_name || '-')}</td>
                  <td class="px-4 py-3 text-gray-900 dark:text-white font-medium">${esc(s.subject_name || s.subject_code)}</td>
                  <td class="px-4 py-3 text-gray-600 dark:text-gray-400">${paper}</td>
                  <td class="px-4 py-3 text-center">
                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${statusClass}">${statusText}</span>
                  </td>
                  ${isAdmin ? `<td class="px-4 py-3 text-sm text-yellow-600 dark:text-yellow-400">${s.lock_owner ? esc(s.lock_owner) : ''}</td>` : ''}
                  ${isAdmin && s.lock_status === 'LOCKED' && !s.finalized ? `
                    <td class="px-4 py-3">
                      <button onclick="forceRelease('${esc(s.centre_number)}','${esc(s.subject_code)}','${esc(s.paper_type)}')" class="text-xs text-red-600 hover:text-red-700 dark:text-red-400 font-medium">Release</button>
                    </td>
                  ` : (isAdmin ? '<td class="px-4 py-3"></td>' : '')}
                </tr>`;
            }).join('')}
          </tbody>
        </table>`;
    }

    window.forceRelease = async function(centre, subject, paper) {
      const reason = prompt('Reason for force-releasing this lock:');
      if (!reason) return;
      const r = await jpost('/api/locks/force-release', { centre_number: centre, subject_code: subject, paper_type: paper, reason });
      if (r.ok) {
        scopes = await api('/api/scopes').then(r => r.json()).catch(() => []);
        renderSummary();
        renderTable();
      } else {
        const err = await r.json().catch(() => ({}));
        alert('Failed: ' + (err.detail?.message || err.detail || 'Unknown error'));
      }
    };

    // Event handlers
    document.getElementById('search-input').addEventListener('input', (e) => {
      searchTerm = e.target.value.trim();
      renderTable();
    });

    document.getElementById('status-filter').addEventListener('change', (e) => {
      activeFilter = e.target.value;
      renderTable();
    });

    boot();
  </script>
</body>
</html>
