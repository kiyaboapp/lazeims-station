<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAZEIMS Station</title>
  <link rel="stylesheet" href="/static/dist/tailwind.css">
  <script src="/static/vendor/chart.min.js"></script>
  <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen">
  <div id="app">
    <!-- Login Section (shown when not authenticated) -->
    <div id="login-section" class="min-h-screen flex items-center justify-center p-4">
      <div class="w-full max-w-md">
        <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-xl border border-gray-200 dark:border-gray-700 p-8">
          <div class="text-center mb-6">
            <div class="w-14 h-14 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-xl mx-auto mb-4">L</div>
            <h1 class="text-xl font-bold text-gray-900 dark:text-white">LAZEIMS Station</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Exam marks data entry</p>
          </div>

          <!-- Station selector -->
          <div id="station-selector" class="mb-4 hidden"></div>

          <!-- Login form -->
          <form id="login-form" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Initials / Username</label>
              <input id="login-id" type="text" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent" placeholder="Enter initials or username">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">PIN / Password</label>
              <input id="login-secret" type="password" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent" placeholder="Enter PIN or password">
            </div>
            <p id="login-msg" class="text-sm min-h-[1.25rem]"></p>
            <button type="submit" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors">Sign In</button>
          </form>

          <div class="mt-4 text-center">
            <span id="status-pill-login" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400">Checking...</span>
          </div>

          <div class="mt-3 flex justify-center">
            <button id="theme-btn-login" class="p-2 rounded-lg text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" title="Toggle dark mode">
              <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
              <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Dashboard Section (shown after login) -->
    <div id="dashboard-section" class="hidden">
      <!-- Nav will be injected here by nav.js -->
      <main class="lg:ml-64 pt-0 min-h-screen">
        <div class="p-4 md:p-6 max-w-7xl mx-auto">
          <!-- Admin Dashboard -->
          <div id="dash-admin" class="hidden space-y-6">
            <!-- KPI Cards -->
            <div id="admin-kpis" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4"></div>

            <!-- Charts Row -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5">
                <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-3">Marks Per Day (Last 14 Days)</h3>
                <div class="relative h-[200px]"><canvas id="marks-per-day-chart"></canvas></div>
              </div>
              <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5">
                <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-3">Overall Progress</h3>
                <div class="relative h-[200px]"><canvas id="progress-doughnut-chart"></canvas></div>
              </div>
            </div>

            <!-- School Completion + Top Enterers -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5">
                <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-3">School Completion</h3>
                <div class="relative h-[200px]"><canvas id="school-completion-chart"></canvas></div>
              </div>
              <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5">
                <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-3">Top Enterers</h3>
                <div id="top-enterers"></div>
              </div>
            </div>

            <!-- Sync Status -->
            <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5">
              <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-3">Sync Status</h3>
              <div id="admin-sync-status"></div>
            </div>
          </div>

          <!-- DE Dashboard -->
          <div id="dash-de" class="hidden space-y-6">
            <!-- Progress KPIs -->
            <div id="de-kpis" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>

            <!-- Progress Chart -->
            <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5">
              <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-3">My Progress</h3>
              <div class="relative h-[160px]"><canvas id="de-progress-chart"></canvas></div>
            </div>

            <!-- My Scopes -->
            <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5">
              <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-3">My Scopes</h3>
              <div id="de-scopes-list"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { api, jpost, esc, fmt, pct } from './static/js/api.js';
    import { initNav, setPageTitle, getSession } from './static/shared/nav.js';
    import { showSpinner } from './static/shared/loading.js';

    let SESSION = null;
    let chartsInitialized = false;
    const _charts = {};

    async function boot() {
      // Check station availability
      let stationData = null;
      try {
        const r = await api('/api/stations/available');
        if (r.ok) stationData = await r.json();
      } catch (e) {}

      const active = stationData?.active;
      const stations = stationData?.stations || [];

      // Update login status pill
      const pill = document.getElementById('status-pill-login');
      if (active) {
        pill.textContent = active.station_code;
        pill.className = 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400';
      } else if (stations.length === 0) {
        pill.textContent = 'No package imported';
        pill.className = 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-400';
        renderNoPackage();
        return;
      } else {
        pill.textContent = 'Select station';
        pill.className = 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-400';
        renderStationPicker(stations);
        return;
      }

      // Check if already authenticated
      try {
        const me = await api('/api/me');
        if (me.ok) {
          SESSION = await me.json();
          await showDashboard();
          return;
        }
      } catch (e) {}

      // Show login
      document.getElementById('login-section').classList.remove('hidden');
    }

    function renderNoPackage() {
      const sel = document.getElementById('station-selector');
      sel.classList.remove('hidden');
      sel.innerHTML = `
        <div class="bg-yellow-50 dark:bg-yellow-900/20 border border-yellow-200 dark:border-yellow-800 rounded-lg p-4 text-center">
          <p class="text-sm font-medium text-yellow-800 dark:text-yellow-300">No exam package imported yet.</p>
          <p class="text-xs text-yellow-600 dark:text-yellow-400 mt-1">Import a package to begin.</p>
        </div>`;
      document.getElementById('login-form').classList.add('hidden');
    }

    function renderStationPicker(stations) {
      const sel = document.getElementById('station-selector');
      sel.classList.remove('hidden');
      sel.innerHTML = `
        <div class="space-y-2 mb-4">
          <p class="text-sm font-medium text-gray-700 dark:text-gray-300">Select a station:</p>
          ${stations.map(s => `
            <button data-code="${esc(s.station_code)}" data-exam="${esc(s.exam_id)}" class="station-pick w-full flex items-center gap-3 p-3 rounded-lg border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors text-left">
              <div class="w-8 h-8 rounded-lg bg-indigo-100 dark:bg-indigo-900 flex items-center justify-center text-indigo-600 dark:text-indigo-400 text-xs font-bold">S</div>
              <div>
                <p class="text-sm font-medium text-gray-900 dark:text-white">${esc(s.station_code)}</p>
                <p class="text-xs text-gray-500">${fmt(s.students)} students</p>
              </div>
            </button>
          `).join('')}
        </div>`;
      document.getElementById('login-form').classList.add('hidden');

      sel.querySelectorAll('.station-pick').forEach(btn => {
        btn.addEventListener('click', async () => {
          const r = await jpost('/api/stations/switch', { station_code: btn.dataset.code, exam_id: btn.dataset.exam });
          if (r.ok) location.reload();
        });
      });
    }

    async function showDashboard() {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');

      // Init nav
      const navSession = await initNav();
      if (!navSession) return;
      SESSION = navSession;
      setPageTitle('Dashboard');

      const isAdmin = SESSION.role === 'EXAM_ADMIN';
      if (isAdmin) {
        document.getElementById('dash-admin').classList.remove('hidden');
        await loadAdminDashboard();
      } else {
        document.getElementById('dash-de').classList.remove('hidden');
        await loadDEDashboard();
      }
    }

    async function loadAdminDashboard() {
      try {
        const [progress, analytics] = await Promise.all([
          api('/api/progress').then(r => r.json()),
          api('/api/analytics/dashboard').then(r => r.json()).catch(() => null),
        ]);

        // KPI Cards
        const kpis = document.getElementById('admin-kpis');
        const fin = progress.finalized_scopes || 0;
        const total = progress.total_scopes || 0;
        const pctDone = pct(fin, total);
        kpis.innerHTML = [
          { label: 'Scopes Done', value: `${fin}/${total}`, color: fin === total && total > 0 ? 'green' : 'indigo' },
          { label: 'Total Marks', value: fmt(progress.total_marks), color: 'blue' },
          { label: 'Today', value: fmt(progress.marks_today), color: 'purple' },
          { label: 'Students', value: fmt(progress.students), color: 'teal' },
          { label: 'Pending Sync', value: fmt(progress.pending_events), color: progress.pending_events > 0 ? 'yellow' : 'green' },
          { label: 'Complete', value: `${pctDone}%`, color: pctDone === 100 ? 'green' : 'indigo' },
        ].map(k => `
          <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4">
            <p class="text-2xl font-bold text-${k.color}-600 dark:text-${k.color}-400">${k.value}</p>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">${k.label}</p>
          </div>
        `).join('');

        // Charts
        if (analytics) {
          renderMarksPerDayChart(analytics.marks_per_day || []);
          renderProgressDoughnut(fin, total);
          renderSchoolCompletionChart(analytics.per_subject_progress || [], progress.per_school || []);
          renderTopEnterers(analytics.top_enterers || []);
        } else {
          renderProgressDoughnut(fin, total);
        }

        // Sync status
        const syncCfg = await api('/api/sync/config').then(r => r.json()).catch(() => ({}));
        const syncEl = document.getElementById('admin-sync-status');
        if (syncCfg.configured) {
          syncEl.innerHTML = `<div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-green-500"></span><span class="text-sm text-gray-700 dark:text-gray-300">Connected to <strong>${esc(syncCfg.central_url)}</strong></span></div>
            ${progress.pending_events > 0 ? `<p class="text-sm text-yellow-600 dark:text-yellow-400 mt-1">${fmt(progress.pending_events)} events pending sync</p>` : '<p class="text-sm text-green-600 dark:text-green-400 mt-1">All events synced</p>'}`;
        } else {
          syncEl.innerHTML = '<p class="text-sm text-yellow-600 dark:text-yellow-400">Sync not configured. Go to Settings to set up.</p>';
        }
      } catch (e) {
        console.error('Dashboard load error:', e);
      }
    }

    async function loadDEDashboard() {
      try {
        const userId = SESSION.assignment_id;
        const [progress, scopes] = await Promise.all([
          api(`/api/progress?user_id=${userId}`).then(r => r.json()),
          api('/api/scopes').then(r => r.json()),
        ]);

        const fin = scopes.filter(s => s.finalized).length;
        const total = scopes.length;
        const myPct = pct(fin, total);

        // KPI Cards
        document.getElementById('de-kpis').innerHTML = [
          { label: 'Marks Today', value: fmt(progress.marks_today), color: 'indigo' },
          { label: 'Total Marks', value: fmt(progress.total_marks), color: 'blue' },
          { label: 'Scopes Done', value: `${fin}/${total}`, color: 'green' },
          { label: 'Complete', value: `${myPct}%`, color: myPct === 100 ? 'green' : 'purple' },
        ].map(k => `
          <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4">
            <p class="text-2xl font-bold text-${k.color}-600 dark:text-${k.color}-400">${k.value}</p>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">${k.label}</p>
          </div>
        `).join('');

        // Progress doughnut
        renderDEProgressChart(fin, total);

        // Scope list
        const scopesEl = document.getElementById('de-scopes-list');
        if (!scopes.length) {
          scopesEl.innerHTML = '<p class="text-sm text-gray-500 dark:text-gray-400">No scopes assigned.</p>';
        } else {
          scopesEl.innerHTML = `<div class="divide-y divide-gray-200 dark:divide-gray-700">
            ${scopes.map(s => {
              const paper = s.paper_type.replace('THEORY1', 'T1').replace('THEORY2', 'T2').replace('PRACTICAL', 'P');
              const done = s.finalized;
              return `<div class="flex items-center justify-between py-3">
                <div>
                  <p class="text-sm font-medium text-gray-900 dark:text-white">${esc(s.centre_number)} - ${esc(s.school_name || '')}</p>
                  <p class="text-xs text-gray-500 dark:text-gray-400">${esc(s.subject_name || s.subject_code)} - ${esc(paper)}</p>
                </div>
                <div>
                  ${done ? '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400">Done</span>' : `<a href="/entry" class="inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white hover:bg-indigo-700">Enter</a>`}
                </div>
              </div>`;
            }).join('')}
          </div>`;
        }
      } catch (e) {
        console.error('DE dashboard error:', e);
      }
    }

    function renderMarksPerDayChart(data) {
      const ctx = document.getElementById('marks-per-day-chart');
      if (!ctx) return;
      if (_charts.marksPerDay) _charts.marksPerDay.destroy();
      _charts.marksPerDay = new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.map(d => d.date.slice(5)),
          datasets: [{
            label: 'Marks',
            data: data.map(d => d.count),
            borderColor: '#6366f1',
            backgroundColor: 'rgba(99, 102, 241, 0.1)',
            fill: true,
            tension: 0.3,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    function renderProgressDoughnut(fin, total) {
      const ctx = document.getElementById('progress-doughnut-chart');
      if (!ctx) return;
      if (_charts.progressDoughnut) _charts.progressDoughnut.destroy();
      _charts.progressDoughnut = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Finalized', 'Remaining'],
          datasets: [{
            data: [fin, total - fin],
            backgroundColor: ['#10b981', '#e5e7eb'],
            borderWidth: 0,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '70%',
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });
    }

    function renderDEProgressChart(fin, total) {
      const ctx = document.getElementById('de-progress-chart');
      if (!ctx) return;
      if (_charts.deProgress) _charts.deProgress.destroy();
      _charts.deProgress = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Completed', 'Remaining'],
          datasets: [{
            data: [fin, total - fin],
            backgroundColor: ['#6366f1', '#e5e7eb'],
            borderWidth: 0,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '70%',
          plugins: { legend: { position: 'bottom' } }
        }
      });
    }

    function renderSchoolCompletionChart(subjectProgress, perSchool) {
      const ctx = document.getElementById('school-completion-chart');
      if (!ctx) return;
      if (_charts.schoolCompletion) _charts.schoolCompletion.destroy();
      const schools = perSchool.slice(0, 10);
      _charts.schoolCompletion = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: schools.map(s => s.centre_number),
          datasets: [{
            label: 'Finalized',
            data: schools.map(s => s.finalized_scopes),
            backgroundColor: '#10b981',
          }, {
            label: 'Total',
            data: schools.map(s => s.total_scopes),
            backgroundColor: '#e5e7eb',
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'top' } },
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    function renderTopEnterers(enterers) {
      const el = document.getElementById('top-enterers');
      if (!el) return;
      if (!enterers.length) { el.innerHTML = '<p class="text-sm text-gray-500">No data yet.</p>'; return; }
      el.innerHTML = `<div class="divide-y divide-gray-200 dark:divide-gray-700">
        ${enterers.slice(0, 5).map((e, i) => `
          <div class="flex items-center justify-between py-2">
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded-full bg-indigo-100 dark:bg-indigo-900 flex items-center justify-center text-xs font-bold text-indigo-700 dark:text-indigo-300">${i + 1}</span>
              <span class="text-sm text-gray-900 dark:text-white">${esc(e.initials || e.name || 'Unknown')}</span>
            </div>
            <span class="text-sm font-medium text-gray-600 dark:text-gray-400">${fmt(e.total_marks)} marks</span>
          </div>
        `).join('')}
      </div>`;
    }

    // Login form handler
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('login-id').value.trim();
      const secret = document.getElementById('login-secret').value;
      const msg = document.getElementById('login-msg');
      msg.textContent = 'Signing in...';
      msg.className = 'text-sm min-h-[1.25rem] text-gray-600 dark:text-gray-400';

      const [dr, ar] = await Promise.allSettled([
        jpost('/api/login/de', { pin: secret, initials: id }),
        jpost('/api/login/admin', { username: id, password: secret }),
      ]);
      const dok = dr.status === 'fulfilled' && dr.value.ok;
      const aok = ar.status === 'fulfilled' && ar.value.ok;
      if (dok) { SESSION = await dr.value.json(); msg.textContent = ''; await showDashboard(); }
      else if (aok) { SESSION = await ar.value.json(); msg.textContent = ''; await showDashboard(); }
      else { msg.textContent = 'Incorrect credentials.'; msg.className = 'text-sm min-h-[1.25rem] text-red-600 dark:text-red-400'; }
    });

    // Theme toggle on login page
    document.getElementById('theme-btn-login')?.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
    });

    boot();
  </script>
</body>
</html>
